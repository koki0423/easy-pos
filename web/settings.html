<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS設定</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="settings.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="app-label">POS設定</p>
          <h1 id="settings-store-name">読み込み中…</h1>
        </div>
        <a class="settings-button" href="/">レジに戻る</a>
      </header>

      <section id="settings-screen" class="settings-screen" aria-labelledby="settings-title">
        <header class="settings-heading">
          <div>
            <p class="app-label">商品・会計監査</p>
            <h2 id="settings-title">設定</h2>
          </div>
        </header>
        <p class="settings-note">設定内容は直ちに反映され、本番モードを終了すると在庫数0の商品も含めて選択中イベントの商品YAMLに保存されます。</p>

        <div class="settings-grid">
          <section class="settings-panel" aria-labelledby="settings-products-title">
            <div class="section-heading">
              <h3 id="settings-products-title">商品</h3>
              <button id="new-product" class="text-button" type="button">新規商品</button>
            </div>
            <div id="settings-product-list" class="settings-list" aria-label="商品一覧"></div>
            <form id="settings-product-form" class="settings-form">
              <h4 id="settings-product-form-title">商品を追加</h4>
              <label>商品ID
                <input id="settings-product-id" type="text" maxlength="64" pattern="[A-Za-z0-9_-]+" required autocomplete="off" />
              </label>
              <label>商品名
                <input id="settings-product-name" type="text" maxlength="100" required />
              </label>
              <label>単価（税込）
                <input id="settings-product-price" type="number" min="0" step="1" inputmode="numeric" required />
              </label>
              <label>現在庫
                <input id="settings-product-stock" type="number" min="0" step="1" inputmode="numeric" required />
              </label>
              <div class="settings-form-actions">
                <button class="primary-button" type="submit">保存</button>
                <button id="delete-product" class="danger-button" type="button" hidden>削除</button>
              </div>
              <p id="settings-product-status" class="settings-status" role="status"></p>
            </form>
          </section>

          <section class="settings-panel" aria-labelledby="settings-sets-title">
            <div class="section-heading">
              <h3 id="settings-sets-title">セット割引</h3>
              <button id="new-set" class="text-button" type="button">新規セット</button>
            </div>
            <label class="settings-select-label" for="settings-set-select">編集するセット
              <select id="settings-set-select"></select>
            </label>
            <form id="settings-set-form" class="settings-form">
              <h4 id="settings-set-form-title">セットを追加</h4>
              <label>セットID
                <input id="settings-set-id" type="text" maxlength="64" pattern="[A-Za-z0-9_-]+" required autocomplete="off" />
              </label>
              <label>セット名
                <input id="settings-set-name" type="text" maxlength="100" required />
              </label>
              <label>セット価格（税込）
                <input id="settings-set-price" type="number" min="0" step="1" inputmode="numeric" required />
              </label>
              <div class="set-items-heading">
                <span>対象商品・数量</span>
                <button id="add-set-item" class="text-button" type="button">商品を追加</button>
              </div>
              <div id="settings-set-items" class="set-items"></div>
              <div class="settings-form-actions">
                <button class="primary-button" type="submit">保存</button>
                <button id="delete-set" class="danger-button" type="button" hidden>削除</button>
              </div>
              <p id="settings-set-status" class="settings-status" role="status"></p>
            </form>
          </section>

          <section class="settings-panel audit-panel" aria-labelledby="settings-audit-title">
            <div class="section-heading">
              <h3 id="settings-audit-title">会計監査出力</h3>
            </div>
            <p class="settings-description">すべての会計・取消・返金・訂正をCSVに書き出します。</p>
            <form id="settings-audit-form" class="settings-form">
              <label>CSVの出力先ディレクトリ
                <input id="settings-audit-directory" type="text" placeholder="例: C:\\POS\\audit" autocomplete="off" />
              </label>
              <div class="settings-form-actions">
                <button class="primary-button" type="submit">出力先を保存</button>
                <button id="export-audit" type="button">今すぐ監査CSVを出力</button>
                <button id="export-operations-audit" type="button">運用監査CSVを出力</button>
              </div>
              <p id="settings-audit-status" class="settings-status" role="status"></p>
            </form>
          </section>
        </div>
      </section>

      <p id="settings-page-error" class="settings-page-error" role="alert" hidden></p>
    </main>
  </body>
</html>
